server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax

spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/permission_admin}
    username: ${DB_USERNAME:permission_admin}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  session:
    data:
      redis:
        namespace: permission-admin:session

flowable:
  database-schema-update: "${FLOWABLE_DATABASE_SCHEMA_UPDATE:true}"

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
bootstrap:
  username: ${BOOTSTRAP_ADMIN_USERNAME:}
  password: ${BOOTSTRAP_ADMIN_PASSWORD:}
